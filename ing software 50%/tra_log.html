<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transacciones</title>
  <link rel="stylesheet" href="./style/tra_log_style.css" />
</head>
<body>

  <input type="checkbox" id="menu-toggle" />
  <label for="menu-toggle" id="menu-btn">
    <span></span>
    <span></span>
    <span></span>
  </label>

  <nav id="sidebar">
    <ul>
      <li><a href="ini_log.html">Inicio</a></li>
      <li><a href="emp_log.html">Empresas</a></li>
      <li><a href="tra_con_log.html">Transacciones</a></li>
      <li><a href="cat_log.html">Catálogo</a></li>
      <li><a href="ayu_log.html">Ayuda</a></li>
    </ul>
  </nav>

  <h1 class="header">Transacciones</h1>
  <img src="./img/logo-wayne-corp.png" alt="Wayne Corp Logo" class="logo" />

  <a href="login.html">
    <img src="./img/usuario.png" alt="Usuario" class="user-icon" />
  </a>

  <img src="./img/mensaje_azul.png" alt="Correo" class="mail-icon" />

  <div class="form-container">
    <form> 
      <h2>Registro de Transferencia</h2>
      
      <div id="order-total-display" class="form-group" style="text-align: center; font-size: 1.2rem; font-weight: bold; padding: 10px; background-color: #e9ecef; border-radius: 4px; margin-bottom: 25px; display: none;">
        Monto Total del Pedido: <span id="display-total-amount">0.00$</span>
      </div>
      
      <div class="form-group">
        <label for="id_doc">Cédula o RIF:</label>
        <input type="text" id="id_doc" name="id_doc" required>
      </div>

      <div class="form-group">
        <label for="fecha_emision">Fecha de Emisión:</label>
        <input type="date" id="fecha_emision" name="fecha_emision" required>
      </div>

      <div class="form-group">
        <label for="referencia">Referencia:</label>
        <input type="text" id="referencia" name="referencia" required>
      </div>

      <div class="form-group">
        <label for="monto_transf">Monto Transferido:</label>
        <input type="number" id="monto_transf" name="monto_transf" step="0.01" required> 
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="certificacion" name="certificacion" required>
        <label for="certificacion">Certifico que el monto que transferí es igual al **Monto Total del Pedido**.</label>
      </div>

      <button type="submit" class="send-btn">Enviar</button>
    </form>
  </div>
  <footer>
    <p>Maracaibo, Venezuela | Derechos Reservado ©</p>
  </footer>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const totalAmount = urlParams.get('total');
        
        const totalDisplayDiv = document.getElementById('order-total-display');
        const displaySpan = document.getElementById('display-total-amount');
        // const montoRefInput = document.getElementById('monto_ref'); // Campo eliminado
        const montoTransfInput = document.getElementById('monto_transf');
        const certificacionCheckbox = document.getElementById('certificacion');
        const form = document.querySelector('.form-container form');

        let expectedTotal = 0;

        if (totalAmount) {
            expectedTotal = parseFloat(totalAmount);
            const formattedTotal = expectedTotal.toFixed(2);
            
            displaySpan.textContent = formattedTotal + '$';
            totalDisplayDiv.style.display = 'block';

            // 2. Rellenar el campo 'Monto Transferido'
            if (montoTransfInput && !montoTransfInput.value) {
                montoTransfInput.value = formattedTotal;
            }
        }
        
        // -----------------------------------------------------
        // LÓGICA DE CLAVES ÚNICAS
        // -----------------------------------------------------
        
        // Clave de historial privado por usuario
        const getTransactionHistoryKey = () => {
            const userEmail = localStorage.getItem('currentUserEmail');
            if (!userEmail) {
                return 'transactionHistory_GUEST'; 
            }
            return `transactionHistory_${userEmail}`;
        };

        // Clave de historial global para el administrador
        const GLOBAL_HISTORY_KEY = 'transactionHistory_GLOBAL';

        // Clave del carrito por usuario
        const getCartStorageKey = () => {
            const userEmail = localStorage.getItem('currentUserEmail');
            return userEmail ? `wayneCorpCart_${userEmail}` : 'wayneCorpCart_GUEST';
        };

        // -----------------------------------------------------
        // LÓGICA DE PROCESAMIENTO DE TRANSACCIÓN
        // -----------------------------------------------------

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // 0. Validación de Montos
            const montoTransferido = parseFloat(montoTransfInput.value);
            
            if (isNaN(montoTransferido) || montoTransferido <= 0) {
                 alert('Por favor, ingrese un Monto Transferido válido.');
                 return;
            }
            if (!certificacionCheckbox.checked) {
                alert('Debe certificar que el Monto Transferido es igual al Monto Total del Pedido para continuar.');
                return;
            }
            if (Number(montoTransferido.toFixed(2)) !== Number(expectedTotal.toFixed(2))) {
                alert(`Error de Monto: El Monto Transferido (${montoTransferido.toFixed(2)}$) debe ser exactamente igual al Monto Total del Pedido (${expectedTotal.toFixed(2)}$).`);
                return;
            }


            // 1. Obtener datos de la orden y del formulario
            const lastOrderDataString = localStorage.getItem('lastOrderData');
            
            if (!lastOrderDataString) {
                alert('Error: No se encontró información de la orden reciente. Por favor, intente de nuevo desde el catálogo.');
                return;
            }

            const lastOrderData = JSON.parse(lastOrderDataString);
            
            const cedulaRif = document.getElementById('id_doc').value;
            const referencia = document.getElementById('referencia').value;
            const fechaEmision = document.getElementById('fecha_emision').value;
            const userEmail = localStorage.getItem('currentUserEmail') || 'GUEST'; // Obtener el email

            // 2. Crear el registro de la transacción
            const newTransaction = {
                id: Date.now(),
                date: fechaEmision || new Date().toISOString().split('T')[0],
                total: lastOrderData.total,
                cedulaRif: cedulaRif,
                referencia: referencia,
                items: lastOrderData.items,
                userEmail: userEmail // <-- NUEVO: Añadir el email del usuario para el log global
            };
            
            // 3. GUARDAR EN CLAVE PRIVADA DEL USUARIO (para tra_con_log.html)
            const historyKey = getTransactionHistoryKey(); 
            const historyString = localStorage.getItem(historyKey);
            let history = historyString ? JSON.parse(historyString) : [];
            history.push(newTransaction);
            localStorage.setItem(historyKey, JSON.stringify(history));

            // 4. GUARDAR EN CLAVE GLOBAL PARA EL ADMINISTRADOR (para tra_con_adm.html)
            const globalHistoryString = localStorage.getItem(GLOBAL_HISTORY_KEY);
            let globalHistory = globalHistoryString ? JSON.parse(globalHistoryString) : [];
            globalHistory.push(newTransaction);
            localStorage.setItem(GLOBAL_HISTORY_KEY, JSON.stringify(globalHistory));

            // 5. LIMPIAR EL CARRITO ACTIVO y los datos temporales
            localStorage.removeItem(getCartStorageKey()); 
            localStorage.removeItem('lastOrderData'); 

            alert('Transferencia registrada con éxito. Redirigiendo a Historial de Transacciones.');
            
            // 6. Redirigir a la vista de historial
            window.location.href = 'tra_con_log.html';
        });
    });
  </script>

</body>
</html>
