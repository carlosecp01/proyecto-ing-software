<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo - Wayne Corp</title>
  <link rel="stylesheet" href="./style/cat_log_style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
</head>
<body>

  <input type="checkbox" id="menu-toggle" />
  <label for="menu-toggle" id="menu-btn">
    <span></span>
    <span></span>
    <span></span>
  </label>

  <nav id="sidebar">
    <ul>
      <li><a href="ini_log.html">Inicio</a></li>
      <li><a href="emp_log.html">Empresas</a></li>
      <li><a href="tra_con_log.html">Transacciones</a></li>
      <li><a href="cat_log.html">Catálogo</a></li>
      <li><a href="ayu_log.html">Ayuda</a></li>
      <li><a href="log.html">Cerrar Sesión</a></li>
    </ul>
  </nav>

  <div class="content-wrapper">
    <h1 class="header">Catálogo</h1>
    
    <div class="search-filter-container">
      <div class="search-bar">
        <input type="text" placeholder="Buscar producto..." class="search-input" />
        <i class="fas fa-search search-icon"></i>
      </div>

      </div>

    <div class="product-grid">
      </div>
  </div>

  <div class="footer-icons">
    <div class="cart-icon-container" id="open-cart-btn">
        <i class="fas fa-shopping-cart"></i>
        <span id="cart-count" class="cart-count-badge">0</span>
    </div>
    
    <img src="./img/logo-wayne-corp.png" alt="Wayne Corp Logo" class="logo" />
   
  </div>

  <footer>
    <p>Maracaibo, Venezuela | Derechos Reservado ©</p>
  </footer>

  <template id="product-detail-template">
    <div class="prod-detail-layout">
      <div class="prod-info">
        <h2 id="prod-name">Nombre del Producto</h2>
        <p id="prod-description">Descripción detallada del producto.</p>
        
        <div class="quantity-controls">
          <label for="product-quantity">Cantidad:</label>
          <input type="number" id="product-quantity" value="1" min="1" max="99" required>
        </div>
        
        <button class="buy-button" id="add-to-cart-btn">Añadir al Carrito</button>
      </div>
      <div class="prod-image-price">
        <img id="prod-image" src="" alt="Imagen del producto" />
        <p id="prod-price" class="product-price">0$</p>
        <input type="hidden" id="prod-data-name" />
        <input type="hidden" id="prod-data-price" />
      </div>
    </div>
  </template>
  
  <template id="cart-template">
    <div class="cart-content-layout">
      <h2>🛒 Carrito de Compras</h2>
      <div id="cart-items-list">
        </div>
      <div class="cart-summary">
        <p>Total de Artículos: <span id="cart-total-items">0</span></p>
        <p>Total a Pagar: <span id="cart-total-price">0.00$</span></p>
      </div>
      <button class="buy-button checkout-button">Finalizar Compra</button>
    </div>
  </template>

  <div id="product-prod-container" class="prod-container">
    <div class="prod-content">
      <span class="close-button">&times;</span>
      <div id="modal-content-container">
      </div>
    </div>
  </div>

  <script src="cat_log_js.js"></script>

</body>
</html>
